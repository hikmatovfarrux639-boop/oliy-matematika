<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Glowing background circles -->
  <circle cx="200" cy="150" r="260" fill="#3b82f6" opacity="0.12" filter="blur(60px)" />
  <circle cx="1000" cy="450" r="300" fill="#8b5cf6" opacity="0.12" filter="blur(70px)" />

  <!-- Decorative math watermark symbols -->
  <text x="920" y="240" font-family="serif" font-size="200" fill="#ffffff" fill-opacity="0.04" font-style="italic">∫</text>
  <text x="750" y="520" font-family="serif" font-size="160" fill="#ffffff" fill-opacity="0.03" font-style="italic">∑</text>
  <text x="150" y="550" font-family="serif" font-size="140" fill="#ffffff" fill-opacity="0.03" font-style="italic">∇</text>
  <text x="1050" y="560" font-family="sans-serif" font-size="110" fill="#ffffff" fill-opacity="0.03" font-weight="bold">lim</text>

  <!-- Main Card -->
  <rect x="70" y="70" width="1060" height="490" rx="28" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Logo and Badge -->
  <g transform="translate(120, 130)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="#2563eb" />
    <text x="32" y="44" font-family="sans-serif" font-size="36" fill="#ffffff" text-anchor="middle" font-weight="900">∫</text>

    <!-- Top Badge -->
    <rect x="80" y="14" width="310" height="36" rx="18" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
    <circle cx="98" cy="32" r="5" fill="#10b981" />
    <text x="114" y="38" font-family="sans-serif" font-size="15" fill="#93c5fd" font-weight="bold">100% BEPUL VA O'ZBEKCHA</text>
  </g>

  <!-- Main Title -->
  <text x="120" y="265" font-family="sans-serif" font-size="54" font-weight="900" fill="url(#textGrad)">
    Oliy Matematika Platformasi
  </text>
  
  <text x="120" y="325" font-family="sans-serif" font-size="24" fill="#cbd5e1" font-weight="400">
    Universitet talabalari uchun nazariya, amaliyot va imtihon simulyatori
  </text>

  <!-- Feature Pills -->
  <g transform="translate(120, 375)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="60" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="24" y="37" font-size="22">📚</text>
    <text x="56" y="28" font-family="sans-serif" font-size="16" fill="#ffffff" font-weight="bold">73 ta Dars</text>
    <text x="56" y="47" font-family="sans-serif" font-size="12" fill="#94a3b8">14 ta to'liq modul</text>

    <!-- Pill 2 -->
    <rect x="240" y="0" width="230" height="60" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="264" y="37" font-size="22">📝</text>
    <text x="296" y="28" font-family="sans-serif" font-size="16" fill="#ffffff" font-weight="bold">HEMIS Testlar</text>
    <text x="296" y="47" font-family="sans-serif" font-size="12" fill="#94a3b8">103 ta saralangan savol</text>

    <!-- Pill 3 -->
    <rect x="490" y="0" width="220" height="60" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="514" y="37" font-size="22">🔢</text>
    <text x="546" y="28" font-family="sans-serif" font-size="16" fill="#ffffff" font-weight="bold">Kalkulyatorlar</text>
    <text x="546" y="47" font-family="sans-serif" font-size="12" fill="#94a3b8">Matritsa va 2D/3D Vektor</text>

    <!-- Pill 4 -->
    <rect x="730" y="0" width="200" height="60" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="754" y="37" font-size="22">🤖</text>
    <text x="786" y="28" font-family="sans-serif" font-size="16" fill="#ffffff" font-weight="bold">AI Yechuvchi</text>
    <text x="786" y="47" font-family="sans-serif" font-size="12" fill="#94a3b8">Qadamma-qadam tahlil</text>
  </g>

  <!-- Footer URL in card -->
  <g transform="translate(120, 500)">
    <text x="0" y="0" font-family="sans-serif" font-size="19" fill="#38bdf8" font-weight="700">
      🌐 oliy-matematika.vercel.app
    </text>
    <text x="960" y="0" font-family="sans-serif" font-size="15" fill="#64748b" text-anchor="end">
      TATU • O'zMU • TDTU • SamDU standartlari
    </text>
  </g>
</svg>
